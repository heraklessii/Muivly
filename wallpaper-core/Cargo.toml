[package]
name = "wallpaper-core"
version = "0.1.0"
edition = "2021"

[[bin]]
# The crate keeps the architectural name; the shipped executable carries the
# product name, because users see it in Task Manager.
name = "muivly-core"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_UI_HiDpi"] }
