name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    # Muivly is Win32 all the way down (DXGI, D3D11, Media Foundation,
    # WorkerW). There is nothing meaningful to check on another OS.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --release

      - name: Probe runs
        # Smoke test: the capability probe must survive on the runner's
        # virtual display adapter, which is exactly the "no hardware decoder"
        # path real users on old machines can hit.
        run: cargo run --release -- --caps

  ui:
    # Separate job, and separate Cargo workspace: pulling Tauri's dependency
    # tree into the engine check would multiply its build time for no gain.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: wallpaper-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wallpaper-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallpaper-ui/src-tauri

      - run: npm ci

      - name: Frontend build
        # Runs tsc first, so a type error fails here rather than at bundle time.
        run: npm run build

      - name: Format
        run: cargo fmt --all -- --check
        working-directory: wallpaper-ui/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: wallpaper-ui/src-tauri

      - name: Test
        # The panel is mostly glue, but not all of it: the package format
        # writes a zip by hand, and the name it unpacks entries under is the
        # one place a downloaded file could try to write outside its folder.
        run: cargo test
        working-directory: wallpaper-ui/src-tauri
