name: Release

on:
  push:
    tags: ['v*']
  # Lets a release be rehearsed without tagging.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wallpaper-ui/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Build engine
        run: cargo build --release

      - name: Stage engine for bundling
        shell: pwsh
        # The installer ships both processes. The path is injected below
        # rather than written into tauri.conf.json, so a plain `cargo build`
        # of the UI does not require the engine to have been built first.
        run: |
          New-Item -ItemType Directory -Force wallpaper-ui/src-tauri/binaries | Out-Null
          Copy-Item target/release/muivly-core.exe wallpaper-ui/src-tauri/binaries/

      - name: Install UI dependencies
        run: npm ci
        working-directory: wallpaper-ui

      - name: Build installer
        shell: pwsh
        working-directory: wallpaper-ui
        # Through a file rather than as an inline argument. The inline form
        # has to survive YAML, then PowerShell, then the `npx` shim, then
        # Node's own argv parsing, and it did not: the Tauri CLI was handed
        # the backslashes literally and refused the config with "key must be
        # a string at line 1 column 2". A path has nothing to escape.
        #
        # A map, not a list: given a list the bundler keeps the staging
        # subdirectory, and the engine installs to binaries\muivly-core.exe
        # while the UI looks for it next to itself. The map names the
        # destination.
        run: |
          [System.IO.File]::WriteAllText(
            "$PWD/bundle.json",
            '{"bundle":{"resources":{"binaries/muivly-core.exe":"muivly-core.exe"}}}'
          )
          npx tauri build --config bundle.json

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            'dev'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Portable: unzip and run, no installer and no registry writes.
          $staging = "Muivly-$version-portable"
          New-Item -ItemType Directory $staging | Out-Null
          Copy-Item target/release/muivly-core.exe $staging
          Copy-Item wallpaper-ui/src-tauri/target/release/muivly-ui.exe $staging
          Copy-Item LICENSE, README.md $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

          # Installer, named to match.
          $setup = Get-ChildItem wallpaper-ui/src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          Copy-Item $setup.FullName "Muivly-$version-setup.exe"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem "Muivly-$env:VERSION-*.zip", "Muivly-$env:VERSION-*.exe" | ForEach-Object {
            (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() + "  $($_.Name)" |
              Out-File "$($_.Name).sha256" -Encoding ascii
          }

      - name: winget manifests
        shell: pwsh
        # Rendered here rather than by hand, because the installer's hash is
        # only known once it has been built. The result is uploaded with the
        # release; submitting it to microsoft/winget-pkgs is a deliberate
        # step someone takes, not something a tag push does on its own.
        run: |
          $setup = "Muivly-$env:VERSION-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $date = (Get-Date).ToString('yyyy-MM-dd')

          New-Item -ItemType Directory -Force winget | Out-Null
          Get-ChildItem packaging/winget/*.yaml | ForEach-Object {
            (Get-Content $_ -Raw).
              Replace('__VERSION__', $env:VERSION).
              Replace('__SHA256__', $hash).
              Replace('__DATE__', $date) |
              Out-File "winget/$($_.Name)" -Encoding utf8 -NoNewline
          }

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            Muivly-*.zip
            Muivly-*-setup.exe
            Muivly-*.sha256
            winget/*.yaml

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            Muivly-*.zip
            Muivly-*-setup.exe
            Muivly-*.sha256
