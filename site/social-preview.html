<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Muivly — social preview</title>

    <!--
      The source of the repository's social preview card (Settings → General →
      Social preview). GitHub wants a 1280×640 raster, so this is rendered to
      social-preview.png rather than uploaded directly:

        msedge --headless --disable-gpu --screenshot=social-preview.png \
               --window-size=1280,640 --hide-scrollbars social-preview.html

      Kept in the repository so the card can be regenerated when the numbers
      in it stop being true — a preview image nobody can rebuild is a preview
      image that slowly starts lying.
    -->

    <style>
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 100 900;
        src: url('./fonts/outfit-latin.woff2') format('woff2');
      }

      :root {
        --bg: #0f1115;
        --text: #e8eaed;
        --text-muted: #8b93a3;
        --accent: #2dd4bf;
        --border: #262b35;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 74px 88px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;

        /* A very quiet teal wash from the top left, so the card is not a
           flat rectangle in a feed of flat rectangles. */
        background-image: radial-gradient(
          900px 500px at 12% -10%,
          rgb(45 212 191 / 13%),
          transparent 70%
        );
      }

      .wordmark {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .wordmark b {
        color: var(--accent);
        font-weight: 600;
      }

      h1 {
        font-size: 76px;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: -0.03em;
        max-width: 17ch;
      }

      h1 em {
        font-style: normal;
        color: var(--accent);
      }

      p.lede {
        margin-top: 22px;
        font-size: 27px;
        line-height: 1.45;
        color: var(--text-muted);
        max-width: 32ch;
      }

      /* The three numbers that are the whole argument, along the bottom. */
      .figures {
        display: flex;
        gap: 64px;
        align-items: flex-end;
      }

      .figure .value {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }

      .figure .label {
        margin-top: 4px;
        font-size: 19px;
        color: var(--text-muted);
        line-height: 1.35;
      }

      .figures .rule {
        flex: 1;
        height: 1px;
        background: var(--border);
        margin-bottom: 16px;
      }

      .badge {
        font-size: 19px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 12px;
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <div>
      <p class="wordmark">Mui<b>vly</b></p>
    </div>

    <div>
      <h1>A live wallpaper engine you <em>cannot tell</em> is running.</h1>
      <p class="lede">
        Native Windows. GPU decode, zero-copy, and zero work when nothing is visible.
      </p>
    </div>

    <div class="figures">
      <div class="figure">
        <div class="value">0.4%</div>
        <div class="label">of one core<br />behind a game</div>
      </div>
      <div class="figure">
        <div class="value">1</div>
        <div class="label">decode shared<br />across monitors</div>
      </div>
      <div class="figure">
        <div class="value">0</div>
        <div class="label">telemetry,<br />accounts, pings</div>
      </div>
      <div class="rule"></div>
      <div class="badge">Rust · Apache-2.0</div>
    </div>
  </body>
</html>
