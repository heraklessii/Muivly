ShortDescription: A light live wallpaper engine for Windows.
Description: >-
  Muivly plays video and image wallpapers on the Windows desktop, built for
  machines that cannot spare much for one. Video is decoded on the GPU and
  never copied through system memory, monitors showing the same clip share a
  single decode, and rendering stops entirely when a fullscreen window covers
  the desktop. It lowers its frame rate on battery and stops under battery
  saver. No telemetry, no background network traffic, no account.
