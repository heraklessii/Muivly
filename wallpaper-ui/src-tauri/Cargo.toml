[package]
name = "muivly-ui"
version = "0.1.0"
edition = "2021"
description = "Muivly settings panel"

# Its own workspace: the root one builds wallpaper-core, and CI must not pull
# Tauri's dependency tree in to check the engine.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
